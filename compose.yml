services:
  caddymgm:
    image: ghcr.io/thetaran/caddymgm:latest
    build: .
    container_name: caddymgm
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8080:8080"
    environment:
      CADDY_CONFIG_PATH: /config/Caddyfile
      CADDYMGM_SETTINGS_PATH: /config/caddymgm-settings.json
      CADDYMGM_AUTH_ENABLED: ${CADDYMGM_AUTH_ENABLED:-true}
      CADDYMGM_ADMIN_USER: ${CADDYMGM_ADMIN_USER:-admin}
      CADDYMGM_ADMIN_PASSWORD: ${CADDYMGM_ADMIN_PASSWORD:-changeme}
    volumes:
      - ./config:/config

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./config:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
