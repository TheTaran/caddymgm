services:
  caddy-init:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: caddy-init
    profiles:
      - docker-caddy
    user: "0:0"
    command:
      - sh
      - -c
      - |
        mkdir -p /data /logs /config /srv /ca-certificates /caddymgm-config
        chown -R "${PUID:-1000}:${PGID:-1000}" /config /logs /data /srv /ca-certificates /caddymgm-config
    volumes:
      - ./caddy-config:/config
      - ./caddy-logs:/logs
      - ./caddy-data:/data
      - ./ca-certificates:/ca-certificates
      - ./caddymgm-config:/caddymgm-config

  caddymgm:
    image: ghcr.io/thetaran/caddymgm:latest
    build:
      context: ./caddymgmdev
    container_name: caddymgm
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    environment:
      CADDY_CONFIG_PATH: /config/Caddyfile
      CADDYMGM_SETTINGS_PATH: /caddymgm-config/caddymgm-settings.json
      CADDYMGM_AUTH_ENABLED: ${CADDYMGM_AUTH_ENABLED:-true}
      CADDYMGM_LOCALAUTH_ENABLED: ${CADDYMGM_LOCALAUTH_ENABLED:-true}
      CADDYMGM_OIDCAUTH_ENABLED: ${CADDYMGM_OIDCAUTH_ENABLED:-false}
      CADDYMGM_ADMIN_USER: ${CADDYMGM_ADMIN_USER:-admin}
      CADDYMGM_ADMIN_PASSWORD: ${CADDYMGM_ADMIN_PASSWORD:-changeme}
      CADDYMGM_CADDY_MODE: ${CADDYMGM_CADDY_MODE:-file}
      CADDYMGM_CADDY_API_URL: ${CADDYMGM_CADDY_API_URL:-}
      CADDYMGM_ACCESS_LOG_DIR: ${CADDYMGM_ACCESS_LOG_DIR:-/logs}
      CADDYMGM_CADDY_DATA_DIR: /caddy-data
      CADDYMGM_CA_CERT_DIR: /ca-certificates
      CADDYMGM_WEB_LISTEN: ${CADDYMGM_WEB_LISTEN:-:8080}
      CADDYMGM_WEB_PORT: ${CADDYMGM_WEB_PORT:-8080}
      CADDY_ACCESS_LOG_DIR: ${CADDY_ACCESS_LOG_DIR:-/logs}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy-config:/config
      - ./caddy-logs:/logs
      - ./caddy-data:/caddy-data
      - ./ca-certificates:/ca-certificates
      - ./caddymgm-config:/caddymgm-config

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: caddy
    profiles:
      - docker-caddy
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    depends_on:
      caddy-init:
        condition: service_completed_successfully
    environment:
      CADDY_ADMIN: 0.0.0.0:2019
    command:
      - sh
      - -c
      - |
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | tee -a /logs/caddy-service.log
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
      - "${CADDYMGM_WEB_PORT:-8080}:${CADDYMGM_WEB_PORT:-8080}"
    volumes:
      - ./caddy-config:/etc/caddy:ro
      - ./caddy-data/site:/srv
      - ./caddy-logs:/logs
      - ./caddy-data:/data
      - ./caddy-data/state:/config
      - ./ca-certificates:/ca-certificates:ro
