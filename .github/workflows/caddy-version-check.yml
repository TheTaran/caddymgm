name: Check component versions

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check pinned component versions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          caddy_current="$(sed -nE 's/^[[:space:]]*CADDY_VERSION: \$\{CADDY_VERSION:-([^}]+)\}.*/\1/p' compose-template.yml)"
          geoip_current="$(sed -nE 's/^ARG CADDY_GEOIP_MODULE_VERSION=([^[:space:]]+).*/\1/p' caddy/Dockerfile)"
          geoipupdate_current="$(sed -nE 's/^FROM ghcr\.io\/maxmind\/geoipupdate:([^[:space:]]+).*/\1/p' caddymgmdev/Dockerfile)"
          go_current="$(sed -nE 's/^go[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' caddymgmdev/go.mod)"
          if [[ -z "${caddy_current}" || -z "${geoip_current}" || -z "${geoipupdate_current}" || -z "${go_current}" ]]; then
            echo "Unable to read all pinned component versions" >&2
            exit 1
          fi

          caddy_release_latest="$(gh api repos/caddyserver/caddy/releases/latest --jq '.tag_name' | sed 's/^v//')"
          caddy_releases="$(gh api 'repos/caddyserver/caddy/releases?per_page=100' --jq '.[].tag_name' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
          caddy_latest=""
          docker_tag_status() {
            curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
              "https://hub.docker.com/v2/repositories/library/caddy/tags/$1"
          }
          while IFS= read -r candidate; do
            [[ -n "${candidate}" ]] || continue
            builder_status="$(docker_tag_status "${candidate}-builder")"
            runtime_status="$(docker_tag_status "${candidate}-alpine")"
            if [[ "${builder_status}" == "200" && "${runtime_status}" == "200" ]]; then
              caddy_latest="${candidate}"
              break
            fi
            if [[ "${builder_status}" != "404" && "${builder_status}" != "200" || "${runtime_status}" != "404" && "${runtime_status}" != "200" ]]; then
              echo "Docker Hub returned unexpected statuses for Caddy ${candidate}: builder=${builder_status}, alpine=${runtime_status}" >&2
              exit 1
            fi
          done <<< "${caddy_releases}"
          geoip_latest="$(gh api 'repos/shift72/caddy-geo-ip/tags?per_page=1' --jq '.[0].name')"
          geoipupdate_latest="$(gh api repos/maxmind/geoipupdate/releases/latest --jq '.tag_name')"
          go_latest="$(curl --fail --silent --show-error --location 'https://go.dev/dl/?mode=json' | jq -r '.[0].version' | sed 's/^go//')"
          if [[ -z "${caddy_release_latest}" || -z "${caddy_latest}" || -z "${geoip_latest}" || "${geoip_latest}" == "null" || -z "${geoipupdate_latest}" || "${geoipupdate_latest}" == "null" || -z "${go_latest}" || "${go_latest}" == "null" ]]; then
            echo "Unable to read the latest component versions" >&2
            exit 1
          fi
          if [[ "${caddy_latest}" != "${caddy_release_latest}" ]]; then
            echo "Caddy ${caddy_release_latest} is released, but its official builder/alpine images are not yet available; using latest published image ${caddy_latest}."
          fi

          updates=()
          rows=()
          check_component() {
            local name="$1" current="$2" latest="$3"
            local status="Current"
            if [[ "${current}" != "${latest}" ]]; then
              status="Update available"
              updates+=("${name}")
            fi
            rows+=("| ${name} | \`${current}\` | \`${latest}\` | ${status} |")
          }
          check_component "Caddy" "${caddy_current}" "${caddy_latest}"
          check_component "Geo-IP Caddy module" "${geoip_current}" "${geoip_latest}"
          check_component "GeoIP Update" "${geoipupdate_current}" "${geoipupdate_latest}"
          check_component "Go" "${go_current}" "${go_latest}"

          issue_title="Component updates available"
          existing_issue="$(gh issue list --repo "${REPOSITORY}" --state open --search "in:title \"${issue_title}\"" --json number --jq '.[0].number')"
          if [[ -z "${existing_issue}" ]]; then
            existing_issue="$(gh issue list --repo "${REPOSITORY}" --state open --search 'in:title "Caddy update available"' --json number --jq '.[0].number')"
          fi

          if [[ "${#updates[@]}" -eq 0 ]]; then
            echo "All pinned components are current."
            if [[ -n "${existing_issue}" ]]; then
              gh issue close "${existing_issue}" --repo "${REPOSITORY}" --comment "Caddy, the Geo-IP Caddy module, GeoIP Update, and Go are current."
            fi
            exit 0
          fi

          issue_body="$(cat <<EOF
          One or more pinned build components have updates available.

          | Component | Pinned | Latest | Status |
          | --- | --- | --- | --- |
          $(printf '%s\n' "${rows[@]}")

          Update the affected pinned versions, rebuild the custom Caddy image, verify \`http.handlers.geoip\` with \`caddy list-modules\`, run the development tests, and publish a release.
          EOF
          )"

          if [[ -n "${existing_issue}" ]]; then
            gh issue edit "${existing_issue}" --repo "${REPOSITORY}" --title "${issue_title}" --body "${issue_body}"
            echo "Updated issue #${existing_issue}."
          else
            gh issue create --repo "${REPOSITORY}" --title "${issue_title}" --body "${issue_body}"
          fi
