name: Build Docker image

on:
  push:
    tags:
      - "v*.*"
      - "*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/thetaran/caddymgm

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: caddymgmdev/go.mod

      - name: Test
        working-directory: caddymgmdev
        run: go test ./...

      - name: Classify tag
        id: release-tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "release_kind=master" >> "$GITHUB_OUTPUT"
            version="${GITHUB_REF_NAME#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "release_kind=minor" >> "$GITHUB_OUTPUT"
            version="${GITHUB_REF_NAME#v}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "minor_version=${version%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: github.ref_type == 'tag' && steps.release-tag.outputs.is_release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.ref_type == 'tag' && steps.release-tag.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker tags
        id: docker-tags
        if: github.ref_type == 'tag' && steps.release-tag.outputs.is_release == 'true'
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            if [[ "${{ steps.release-tag.outputs.release_kind }}" == "master" ]]; then
              echo "${IMAGE_NAME}:latest"
              echo "${IMAGE_NAME}:${{ steps.release-tag.outputs.version }}"
            else
              echo "${IMAGE_NAME}:${{ steps.release-tag.outputs.version }}"
              echo "${IMAGE_NAME}:${{ steps.release-tag.outputs.minor_version }}"
            fi
            echo "${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: github.ref_type == 'tag' && steps.release-tag.outputs.is_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./caddymgmdev
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
