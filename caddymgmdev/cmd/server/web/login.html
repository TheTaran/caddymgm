<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CaddyMGM Login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-body">
    <main class="login-shell">
      <section class="login-panel">
        <div class="login-logo" aria-hidden="true">
          <img src="/CaddyMGM.png" alt="" />
        </div>

        <div id="login-disabled" class="login-note" hidden>
          Authentication is currently disabled.
        </div>

        <form id="login-form" class="login-form" hidden>
          <label>
            Username
            <input id="username" autocomplete="username" />
          </label>
          <label>
            Password
            <input id="password" type="password" autocomplete="current-password" />
          </label>
          <button type="submit">Sign In</button>
        </form>

        <div id="login-divider" class="login-divider" hidden>
          <span>or</span>
        </div>

        <button id="oidc-login" class="secondary login-oidc-button" type="button" hidden>Sign In with OIDC</button>
        <p id="login-method-note" class="login-note" hidden></p>
        <p id="login-error" class="login-error" hidden></p>
      </section>
    </main>
    <footer class="login-footer">
      <span class="login-footer-component">
        <span id="login-caddymgm-version">CaddyMGM —</span>
        <a id="login-caddymgm-update" class="login-update-status" href="https://github.com/TheTaran/caddymgm/pkgs/container/caddymgm" target="_blank" rel="noopener noreferrer">Checking…</a>
      </span>
      <span class="login-footer-separator" aria-hidden="true">|</span>
      <span class="login-footer-component">
        <span id="login-caddy-version">Caddy —</span>
        <a id="login-caddy-update" class="login-update-status" href="https://github.com/caddyserver/caddy/releases/latest" target="_blank" rel="noopener noreferrer">Checking…</a>
      </span>
      <span class="login-footer-separator" aria-hidden="true">|</span>
      <a href="https://github.com/TheTaran/caddymgm" target="_blank" rel="noopener noreferrer">Open source on GitHub</a>
    </footer>
    <script src="/login.js"></script>
  </body>
</html>
