services:
  caddymgm:
    image: ghcr.io/thetaran/caddymgm:latest
    build:
      context: ./caddymgmdev
      args:
        VERSION: ${CADDYMGM_VERSION:-development}
    container_name: caddymgm
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - .env
    environment:
      CADDY_CONFIG_PATH: /config/Caddyfile
      CADDYMGM_SETTINGS_PATH: /caddymgm/caddymgm-settings.json
      CADDYMGM_CADDY_DATA_DIR: /caddy-data
      CADDYMGM_CADDY_VERSION_FILE: /logs/caddy-version
      CADDYMGM_CA_CERT_DIR: /ca-certificates
      CADDYMGM_GEOIP_DB_PATH: /caddymgm/geoip/GeoLite2-City.mmdb
      CADDYMGM_CADDY_API_URL: http://caddy-admin:2019
      CADDYMGM_TRUSTED_PROXIES: caddy,caddy-admin
      CADDYMGM_LOCALAUTH_ENABLED: "true"
      CADDYMGM_ALLOW_INSECURE_HTTP: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy-config:/config
      - ./caddy-logs:/logs
      - ./caddy-data:/caddy-data
      - ./caddy-data/ca-certificates:/ca-certificates
      - ./caddymgm:/caddymgm
    networks:
      - default
      - management

  caddy:
    image: ${CADDY_IMAGE:-caddymgm-caddy:development}
    build:
      context: ./caddy
      args:
        CADDY_VERSION: ${CADDY_VERSION:-2.11.4}
        CADDY_GEOIP_MODULE_VERSION: ${CADDY_GEOIP_MODULE_VERSION:-v0.6.0}
    container_name: caddy
    profiles:
      - docker-caddy
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      CADDY_ADMIN: caddy-admin:2019
    command:
      - sh
      - -c
      - |
        caddy version > /logs/caddy-version
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | tee -a /logs/caddy-service.log
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
      - "8080:8080"
    volumes:
      - ./caddy-config:/etc/caddy:ro
      - ./caddy-data/site:/srv
      - ./caddy-logs:/logs
      - ./caddy-data:/data
      - ./caddy-data/state:/config
      - ./caddy-data/ca-certificates:/ca-certificates:ro
      - ./caddymgm/geoip:/geoip:ro
    networks:
      default:
      management:
        aliases:
          - caddy-admin

networks:
  management:
    internal: true
